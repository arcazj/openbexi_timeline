name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Verify committed browser validators match their schemas
        run: npm run demos:schemas -- --check
      - run: npm run demos:validate
      - run: npm run demos:readme -- --check
      - run: npm run api:spec -- --check
      - run: npm test

  browser-regressions:
    # Match the reviewed baseline OS. Chromium uses deterministic SwiftShader
    # WebGL rendering, so the tests do not depend on a runner's physical GPU.
    runs-on: windows-2025
    # Keep one worker for stable WebGL measurements; allow the expanded editor suite time to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser-compatibility:
    # Functional checks need WebGL2. GPU-less Windows Firefox blocks that API;
    # Ubuntu uses Mesa software rendering while visual baselines stay on Windows.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright install --with-deps firefox webkit
      - name: Install software WebGL drivers
        run: sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: xvfb-run -a npm run test:browser:compat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-compatibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  java-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: mvn --batch-mode verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify model access, editing and AI through the Java server
        run: npm run test:integration
      - run: mvn --batch-mode --no-transfer-progress dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - run: node tools/audit-java-dependencies.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: java-test-and-security-reports
          path: |
            target/surefire-reports/
            target/dependency-audit-osv.json
          retention-days: 14
