name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the Python application image
        run: docker build --tag openbexi-timeline:verify .
      - name: Check container health, demo assets and Python collectors
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name timeline-python-smoke --publish 127.0.0.1:18442:8442 openbexi-timeline:verify
          trap 'docker logs timeline-python-smoke; docker rm --force --volumes timeline-python-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18442/api/v1/health > /tmp/timeline-health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18442/api/v1/health
          curl --fail --silent http://127.0.0.1:18442/demos.html --output /tmp/timeline-demos.html
          grep -q 'OpenBEXI' /tmp/timeline-demos.html
          curl --fail --silent http://127.0.0.1:18442/openbexi_timeline.html --output /tmp/timeline-app.html
          grep -q 'openbexi_timeline' /tmp/timeline-app.html
          curl --fail --silent http://127.0.0.1:18442/demos/catalog.json | python -c 'import json,sys; value=json.load(sys.stdin); assert value'
          docker exec timeline-python-smoke python -c 'import shutil; import openbexi_timeline_server, timeline_data_collector, timeline_plugin_default, timeline_plugin_earthquake, timeline_plugin_volcano; assert shutil.which("java") is None'
          docker exec timeline-python-smoke python -m timeline_data_collector --version

  public-collector:
    # The broker fixture is validated on this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: python -m pip install 'setuptools>=77' -r timeline_data_collector/requirements-test.txt -e timeline_data_collector
      - run: python tools/build-collector.py
      - run: python tools/test-collector.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-collector-packages
          path: dist/collector/
          retention-days: 14

  python-windows:
    # Exercise IOCP accept/disconnect recovery on the bundled runtime platform.
    # The browser job uses a Node static server and cannot cover this path.
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock -e .
      - name: Verify native Windows listeners and API regressions
        run: python -m unittest discover -s tests/python -v

  python-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock psutil==7.2.2
      - run: .venv/bin/python -m pip install -e .
      - run: .venv/bin/python -m unittest discover -s tests/python -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Exercise the browser against two Python workers
        run: node tests/integration/python-backend.mjs
      - name: Exercise HBDS editing, lazy tabs, scoped refresh and persistence
        run: npm run test:hbds:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: python-backend-reports
          path: |
            target/benchmark-*.log
            target/python-backend-browser.png
            target/hbds-browser-integration.json
          retention-days: 14

  data-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Verify committed browser validators match their schemas
        run: npm run demos:schemas -- --check
      - name: Verify HBDS schema and public configuration boundary
        run: npm run hbds:verify
      - run: npm run demos:validate
      - run: npm run demos:readme -- --check
      - run: npm run api:spec -- --check
      - run: npm test
      - run: node --test tests/release-publishing.test.mjs

  browser-regressions:
    # Match the reviewed baseline OS. Chromium uses deterministic SwiftShader
    # WebGL rendering, so the tests do not depend on a runner's physical GPU.
    runs-on: windows-2025
    # Keep one worker for stable WebGL measurements; allow the expanded editor suite time to finish.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser-compatibility:
    # Functional checks need WebGL2. GPU-less Windows Firefox blocks that API;
    # Ubuntu uses Mesa software rendering while visual baselines stay on Windows.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright install --with-deps firefox webkit
      - name: Install software WebGL drivers
        run: sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - run: xvfb-run -a npm run test:browser:compat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: browser-compatibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  python-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify model access, editing and AI through the Python server
        run: npm run test:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: python-api-reports
          path: |
            target/model-workspace-*.json
            target/model-workspace-*.png
          retention-days: 14
