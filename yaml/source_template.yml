# Start: .venv/Scripts/python.exe -m gcs_collector.server yaml/source_template.yml
# Relative local paths resolve from the server's launch directory.
# Install optional drivers: pip install -e ".[connectors,images]"
# For multiple inputs, use a data_path list or repeated namespace entries
# sharing one output model. data_path: [] keeps a namespace import-only.
server:
  poll_seconds: 5       # Pause between completed scans; CLI flags override YAML.
  settle_seconds: 5     # Stable-file delay; zero processes immediately.
  verify_seconds: 300   # Audit content even if file metadata is unchanged.
  log_level: INFO

data_sources:
  - namespace: EXAMPLE
    permission: ''
    converter2events_class: build_in
    connector: secure_sse:8443|secure:8445
    data_model: ./data/EXAMPLE/yyyy/mm/dd
    render:
      textColor: '#000000'
      dateColor: '#000000'
      color: '#00b300'
      alternateColor: '#6ac1db'
    type: local
    enable: true
    data_path: ./data/incoming
    # legacy = original Java log converters; timeline_json = event/session JSON.
    # Existing json_file configurations default to legacy for compatibility.
    format: timeline_json
    filter:
      include: ['*.json']
      exclude: ['*.tmp', 'archive/*']

  - namespace: EXAMPLE
    permission: ''
    converter2events_class: build_in
    filter:
      include: ''
      exclude: ''
    connector: secure_sse:8443|secure:8445
    data_model: ./data/EXAMPLE/yyyy/mm/dd
    render:
      textColor: '#000000'
      dateColor: '#000000'
      color: '#00b300'
      alternateColor: '#6ac1db'
    type: sftp
    enable: false
    format: legacy
    host: '${SFTP_HOST}'
    port: 22
    username: '${SFTP_USER}'
    # Use a key or password. Keep credentials in environment variables.
    key_filename: '${SFTP_KEY_FILE}'
    # password: '${SFTP_PASSWORD}'
    known_hosts: '${SFTP_KNOWN_HOSTS}'
    data_path: /fdc_logs/ESOC
    poll_seconds: 30
    # Retain the original year/day/host/subsystem layout for legacy logs.

  - namespace: EXAMPLE
    permission: ''
    converter2events_class: build_in
    data_path: ''
    connector: secure_sse:8443|secure:8445
    data_model: ./data/EXAMPLE/yyyy/mm/dd
    render:
      textColor: '#000000'
      dateColor: '#000000'
      color: '#00b300'
      alternateColor: '#6ac1db'
    type: s3
    enable: false
    format: timeline_json
    bucket: '${S3_BUCKET}'
    prefix: incoming/events/
    region_name: us-east-1
    # Uses the standard AWS credential chain by default (profile/role/env).
    # profile: collector
    # endpoint_url: https://your-s3-compatible-endpoint
    # aws_access_key_id: '${AWS_ACCESS_KEY_ID}'
    # aws_secret_access_key: '${AWS_SECRET_ACCESS_KEY}'
    # aws_session_token: '${AWS_SESSION_TOKEN}'
    poll_seconds: 30
    filter:
      exclude: ''
      include: ['*.json']

  - namespace: EXAMPLE
    permission: ''
    converter2events_class: build_in
    data_path: ''
    filter:
      include: ''
      exclude: ''
    connector: secure_sse:8443|secure:8445
    data_model: ./data/EXAMPLE/yyyy/mm/dd
    render:
      textColor: '#000000'
      dateColor: '#000000'
      color: '#00b300'
      alternateColor: '#6ac1db'
    type: oracle
    enable: false
    format: timeline_json
    dsn: '${ORACLE_DSN}'
    user: '${ORACLE_USER}'
    password: '${ORACLE_PASSWORD}'
    poll_seconds: 30
    batch_size: 1000
    key_column: EVENT_ID
    watermark_column: CHANGE_SEQUENCE
    watermark_type: number  # number or timestamp
    initial_watermark: 0
    # Use an indexed monotonic change sequence, advanced for inserts/updates.
    # >= deliberately replays ties; records are upserted by key_column.
    # Database deletions require an application-level tombstone/query policy.
    query: >-
      SELECT EVENT_ID, CHANGE_SEQUENCE, START_TIME, END_TIME, TITLE, STATUS
      FROM TIMELINE_EVENTS
      WHERE CHANGE_SEQUENCE >= :watermark
      ORDER BY CHANGE_SEQUENCE, EVENT_ID
    binds: {}
    timezone: UTC  # for Oracle timestamps without timezone information
    field_mapping:
      id: EVENT_ID
      start: START_TIME
      end: END_TIME
      data.title: TITLE
      data.status: STATUS

  # Import-only namespaces. Each UI import section uses its own namespace.
  # Set data_path if these namespaces also need continuous monitoring.
  - namespace: GAR
    type: json_file
    permission: ''
    converter2events_class: build_in
    filter:
      include: ''
      exclude: ''
    connector: secure_sse:8443|secure:8445
    render:
      color: '#a1d9ff'
      textColor: '#000000'
      dateColor: '#000000'
    enable: true
    timezone: UTC      # Naive CSV timestamps; date-only values use midnight UTC.
    data_model: ./data/GAR/yyyy/mm/dd
    data_path: []
  - namespace: SCR
    type: json_file
    permission: ''
    converter2events_class: build_in
    filter:
      include: ''
      exclude: ''
    connector: secure_sse:8443|secure:8445
    render:
      color: '#a1d9ff'
      textColor: '#000000'
      dateColor: '#000000'
    enable: true
    timezone: UTC
    data_model: ./data/SCR/yyyy/mm/dd
    data_path: []
  - namespace: MWO
    type: json_file
    permission: ''
    converter2events_class: build_in
    filter:
      include: ''
      exclude: ''
    connector: secure_sse:8443|secure:8445
    render:
      color: '#a1d9ff'
      textColor: '#000000'
      dateColor: '#000000'
    enable: true
    data_model: ./data/MWO/yyyy/mm/dd
    data_path: []        # MWO Date (MM/DD/YYYY) + GMT always means UTC.

ai:
  enabled: false
  provider: compatible
  # A compatible chat/completions endpoint; include /v1 if required by provider.
  base_url: '${AI_BASE_URL}'
  model: '${AI_MODEL}'
  api_key: '${AI_API_KEY}'
  timeout_seconds: 60
  ocr_engine: rapidocr  # bundled local CPU models; no external AI request
  ocr_language: eng
  # Alternative: set ocr_engine: tesseract, install Tesseract, and set its path.
  # tesseract_cmd: 'C:/Program Files/Tesseract-OCR/tesseract.exe'
# AI runs only when requested for unsupported input/new layouts. Reviewed image
# rules persist beside the server state, use local OCR, and never execute arbitrary
# AI-generated statements. Ambiguous/invalid extraction is not imported silently.
