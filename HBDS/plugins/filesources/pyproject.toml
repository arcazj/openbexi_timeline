[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-plugin-filesources"
version = "1.0.1"
description = "OpenBEXI Timeline filesources plugin"
requires-python = ">=3.12"
readme = "README.md"
license-files = ["LICENSE"]
license = "LicenseRef-OpenBEXI-Commercial-Exempt-1.0"
dependencies = ["timeline-data-collector>=2.9.1,<3"]

[project.entry-points."timeline_data_collector.plugins"]
filesources = "timeline_file_sources:Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timeline_file_sources = ["plugin.json", "lib/*.jar"]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
sftp = ["paramiko>=3.4,<5"]
oracle = ["oracledb>=2,<4"]
