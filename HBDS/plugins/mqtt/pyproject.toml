[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-plugin-mqtt"
version = "1.0.0"
description = "OpenBEXI Timeline mqtt plugin"
requires-python = ">=3.12"
readme = "README.md"
license-files = ["LICENSE"]
license = "LicenseRef-OpenBEXI-Commercial-Exempt-1.0"
dependencies = ["timeline-data-collector>=2.9,<3", "paho-mqtt>=2.1,<3"]

[project.entry-points."timeline_data_collector.plugins"]
mqtt = "timeline_plugin_mqtt:Plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timeline_plugin_mqtt = ["plugin.json", "lib/*.jar"]

[project.scripts]
timeline-convert-mqtt = "timeline_plugin_mqtt:main"
