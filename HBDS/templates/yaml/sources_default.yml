data_sources:
- namespace: TEST_SOURCE1
  type: json_file
  enable: true
  permission: ''
  converter2events_class: build_in
  data_path: /data/
  data_model: /data/yyyy/mm/dd
  filter:
    include: ''
    exclude: ''
  connector: secure_sse:8441|secure:8442
  render:
    textColor: '#000000'
    dateColor: '#000000'
    color: '#00b300'
    alternateColor": '#6ac1db'
- namespace: TEST_SOURCE1
  type: json_file
  enable: false
  permission: <required_permission_for_access>
  converter2events_class: <ConverterToEventsClassName>
  data_path: /test/
  data_model: /test/yyyy/mm/dd
  filter:
    include: ''
    exclude: ''
  connector: secure_sse:8441|secure:8442
  render:
    textColor: '#000000'
    dateColor: '#000000'
    color: '#00b300'
    alternateColor": '#6ac1db'
- namespace: <namespace_for_mongoDb>
  data_path: ''
  data_model: ./data/<namespace_for_mongoDb>/yyyy/mm/dd
  type: mongoDb
  enable: false
  permission: <required_permission_for_access>
  converter2events_class: <ConverterToEventsClassName>
  url: <mongodb_connection_string>
  database: <database_name>
  filter:
    include: ''
    exclude: ''
  connector: secure_sse:8443|secure:8445
  collection: <collection_name>
  render:
    textColor: '#000000'
    dateColor: '#000000'
    color: '#00b300'
    alternateColor": '#6ac1db'
- namespace: <namespace_for_kafka>
  data_path: ''
  data_model: ./data/<namespace_for_kafka>/yyyy/mm/dd
  type: kafka
  enable: false
  permission: <required_permission_for_access>
  converter2events_class: <ConverterToEventsClassName>
  url: <kafka_connection_string>
  partitions:
    ms: <partition_time_in_ms>
  filter:
    include: ''
    exclude: ''
  security:
    protocol: <security_protocol>
    sasl_mechanism: <sasl_mechanism>
  connector: secure_sse:8443|secure:8445
  topicName: <topic_name>
  producer:
    name: <producer_name>
    group: <producer_group>
  compression:
    type: <compression_type>
  version: <kafka_version>
  render:
    textColor: '#000000'
    dateColor: '#000000'
    color: '#00b300'
    alternateColor": '#6ac1db'
  retention:
    ms: <retention_time_in_ms>
  consumer:
    name: <consumer_name>
    group: <consumer_group>
- namespace: <namespace_for_mqtt>
  data_path: ''
