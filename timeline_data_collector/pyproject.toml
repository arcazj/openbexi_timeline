[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timeline-data-collector"
version = "2.9.2"
description = "Workspace-driven ingestion and independently built plugins for OpenBEXI Timeline"
requires-python = ">=3.12"
readme = "README.md"
license-files = ["LICENSE"]
license = "LicenseRef-OpenBEXI-Commercial-Exempt-1.0"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.scripts]
timeline-data-collector = "timeline_data_collector.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
timeline_data_collector = ["static/*"]
