<text x="118" y="465" font-size="26" fill="#0369a1" font-weight="650">earthquake</text>
<text x="118" y="500" font-size="22" fill="#34445b" font-weight="400">source instance</text>
<text x="118" y="534" font-size="22" fill="#34445b" font-weight="400">earthquake plugin</text>
<rect x="352" y="428" width="230" height="128" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="374" y="465" font-size="26" fill="#7c3aed" font-weight="650">volcano</text>
<text x="374" y="500" font-size="22" fill="#34445b" font-weight="400">source instance</text>
<text x="374" y="534" font-size="22" fill="#34445b" font-weight="400">volcano plugin</text>
<text x="96" y="613" font-size="23" fill="#34445b" font-weight="400">Each namespace selects a display model</text>
<text x="96" y="650" font-size="23" fill="#34445b" font-weight="400">and owns its sources and output target.</text>
<text x="96" y="687" font-size="23" fill="#34445b" font-weight="400">A namespace may use several plugins.</text>
<text x="96" y="724" font-size="23" fill="#34445b" font-weight="400">A plugin may serve several namespaces.</text>
<text x="96" y="787" font-size="21" fill="#52657e" font-weight="400">Service settings and plugin registry are shared.</text>
<rect x="650" y="190" width="1080" height="630" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="674" y="216" width="7" height="32" rx="3" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="697" y="241" font-size="28" fill="#122238" font-weight="650">02  Shared execution path</text>
