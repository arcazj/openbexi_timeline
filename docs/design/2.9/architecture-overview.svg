<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1510" viewBox="0 0 2400 1510" role="img" aria-label="HBDS architecture for OpenBEXI Timeline 2.9"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8092aa"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif">
