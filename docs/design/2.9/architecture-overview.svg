<path d="M1351 671 L1375 671" stroke="#8092aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="684" y="787" font-size="24" fill="#52657e" font-weight="400">Independent plugin builds; new plugins require no collector rebuild.</text>
