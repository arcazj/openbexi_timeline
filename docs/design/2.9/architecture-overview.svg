<rect x="1790" y="216" width="7" height="32" rx="3" fill="#047857" stroke="#047857" stroke-width="2"/>
<text x="1813" y="241" font-size="28" fill="#122238" font-weight="650">03  Publish and display</text>
<rect x="1800" y="280" width="502" height="132" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="1822" y="317" font-size="26" fill="#047857" font-weight="650">Common publisher</text>
<text x="1822" y="352" font-size="22" fill="#34445b" font-weight="400">Validate, merge and publish atomically</text>
<text x="1822" y="386" font-size="22" fill="#34445b" font-weight="400">Advance checkpoints after durable output</text>
