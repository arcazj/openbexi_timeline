<text x="706" y="676" font-size="22" fill="#34445b" font-weight="400">File / HTTP / S3 / SQL</text>
<text x="706" y="710" font-size="22" fill="#34445b" font-weight="400">MQTT / new adapters</text>
<rect x="1032" y="604" width="316" height="135" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1054" y="641" font-size="26" fill="#7c3aed" font-weight="650">Converters</text>
<text x="1054" y="676" font-size="22" fill="#34445b" font-weight="400">earthquake / volcano</text>
<text x="1054" y="710" font-size="22" fill="#34445b" font-weight="400">default / other plugins</text>
<rect x="1380" y="604" width="316" height="135" rx="18" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="1402" y="641" font-size="26" fill="#047857" font-weight="650">Record batches</text>
<text x="1402" y="676" font-size="22" fill="#34445b" font-weight="400">Compatible timeline JSON</text>
<text x="1402" y="710" font-size="22" fill="#34445b" font-weight="400">Stable IDs + provenance</text>
