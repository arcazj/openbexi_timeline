<text x="1822" y="497" font-size="26" fill="#047857" font-weight="650">Materialized JSON</text>
<text x="1822" y="532" font-size="22" fill="#34445b" font-weight="400">/data/&lt;namespace&gt;/yyyy/mm/dd</text>
<path d="M2051 575 L2051 614" stroke="#8092aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1800" y="620" width="502" height="155" rx="18" fill="#fff1f6" stroke="#be185d" stroke-width="2"/>
<text x="1822" y="657" font-size="26" fill="#be185d" font-weight="650">Timeline  ·  Java and Python</text>
<text x="1822" y="692" font-size="22" fill="#34445b" font-weight="400">Sessions, events, activities and zones</text>
<text x="1822" y="726" font-size="22" fill="#34445b" font-weight="400">Default: All  |  earthquake  |  volcano</text>
<text x="1822" y="760" font-size="22" fill="#34445b" font-weight="400">Keep by_namespace and existing controls</text>
<rect x="64" y="854" width="720" height="250" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="88" y="880" width="7" height="32" rx="3" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="111" y="905" font-size="28" fill="#122238" font-weight="650">Repeat and recovery</text>
<text x="98" y="951" font-size="23" fill="#34445b" font-weight="400">Run again reprocesses the selected inputs.</text>
<text x="98" y="985" font-size="23" fill="#34445b" font-weight="400">Interval runs wait for completion and never overlap.</text>
<text x="98" y="1019" font-size="23" fill="#34445b" font-weight="400">Streaming keeps one active subscription.</text>
<text x="98" y="1053" font-size="23" fill="#34445b" font-weight="400">Failures preserve the last valid published generation.</text>
<rect x="812" y="854" width="720" height="250" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="836" y="880" width="7" height="32" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
<text x="859" y="905" font-size="28" fill="#122238" font-weight="650">Public and private packages</text>
<text x="846" y="951" font-size="23" fill="#34445b" font-weight="400">Public: core, generators and geoscience plugins.</text>
<text x="846" y="985" font-size="23" fill="#34445b" font-weight="400">Private: operational converters and mappings.</text>
<text x="846" y="1019" font-size="23" fill="#34445b" font-weight="400">Private code, state and live data stay out of releases.</text>
<text x="846" y="1053" font-size="23" fill="#34445b" font-weight="400">Public installations work without private plugins.</text>
<rect x="1560" y="854" width="776" height="250" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="1584" y="880" width="7" height="32" rx="3" fill="#be185d" stroke="#be185d" stroke-width="2"/>
<text x="1607" y="905" font-size="28" fill="#122238" font-weight="650">Static demos</text>
<text x="1594" y="951" font-size="23" fill="#34445b" font-weight="400">NONE reads committed samples without conversion.</text>
<text x="1594" y="985" font-size="23" fill="#34445b" font-weight="400">Demo and live workspace configurations stay separate.</text>
<text x="1594" y="1019" font-size="23" fill="#34445b" font-weight="400">The seven existing catalog demos remain compatible.</text>
<text x="1594" y="1053" font-size="23" fill="#34445b" font-weight="400">Historical and numeric date formats are preserved.</text>
<rect x="64" y="1140" width="2272" height="282" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
<rect x="88" y="1166" width="7" height="32" rx="3" fill="#475569" stroke="#475569" stroke-width="2"/>
<text x="111" y="1191" font-size="28" fill="#122238" font-weight="650">Release 2.9  ·  publication follows implementation and passing regression tests</text>
