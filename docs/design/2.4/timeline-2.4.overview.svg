<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1330" viewBox="0 0 1760 1330" role="img" aria-labelledby="title desc"><title id="title">OpenBEXI Timeline 2.4 HBDS overview</title><desc id="desc">Four hyperclasses group 26 classes. Licensing eligibility is independent of per-model roles. Session and Event inherit TimelineItem. Full attributes and cardinalities are in the companion HBDS JSON.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#475569}.group{font-size:25px;font-weight:700}.node{font-size:20px;font-weight:700}.small{font-size:17px;fill:#475569}.note{font-size:19px}.edge{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="64" y="65" class="title">OpenBEXI Timeline 2.4</text><text x="64" y="102" class="subtitle">Proposed HBDS domain model · 4 hyperclasses · 26 classes · explicit membership and inheritance</text><rect x="1430" y="35" width="260" height="46" rx="23" fill="#fef3c7"/><text x="1560" y="65" text-anchor="middle" class="note">DESIGN PROPOSAL</text><rect x="64" y="150" width="760" height="400" rx="18" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="64" y="150" width="760" height="62" rx="18" fill="#2563eb"/><rect x="64" y="190" width="760" height="22" fill="#2563eb"/><text x="92" y="191" class="group" style="fill:white">Identity and access</text><circle cx="94" cy="251" r="5" fill="#2563eb"/><text x="112" y="258" class="node">Organization → Workspace</text><text x="112" y="285" class="small">Tenant boundary and commercial entitlement</text><circle cx="94" cy="328" r="5" fill="#2563eb"/><text x="112" y="335" class="node">User → Membership → ModelAccess</text><text x="112" y="362" class="small">Access references a role belonging to this model</text><circle cx="94" cy="405" r="5" fill="#2563eb"/><text x="112" y="412" class="node">ModelRole</text><text x="112" y="439" class="small">admin · readWrite · readOnly · optional custom roles</text><circle cx="94" cy="482" r="5" fill="#2563eb"/><text x="112" y="489" class="node">Entitlement</text><text x="112" y="516" class="small">Student / researcher / charity / nonprofit eligibility</text><rect x="936" y="150" width="760" height="400" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="936" y="150" width="760" height="62" rx="18" fill="#7c3aed"/><rect x="936" y="190" width="760" height="22" fill="#7c3aed"/><text x="964" y="191" class="group" style="fill:white">Models and configuration</text><circle cx="966" cy="251" r="5" fill="#7c3aed"/><text x="984" y="258" class="node">TimelineModel → ModelVersion</text><text x="984" y="285" class="small">params · bands · rendering · dataSource</text><circle cx="966" cy="328" r="5" fill="#7c3aed"/><text x="984" y="335" class="node">ConfigurationDocument → DocumentRevision</text><text x="984" y="362" class="small">Original JSON/YAML text and immutable revisions</text><circle cx="966" cy="405" r="5" fill="#7c3aed"/><text x="984" y="412" class="node">DocumentBinding</text><text x="984" y="439" class="small">Model version pins exact document revisions</text><circle cx="966" cy="482" r="5" fill="#7c3aed"/><text x="984" y="489" class="node">Filter + ModelPreference</text><text x="984" y="516" class="small">Model-owned filters; user-specific active selection</text><rect x="64" y="680" width="760" height="400" rx="18" fill="#fff" stroke="#047857" stroke-width="2"/><rect x="64" y="680" width="760" height="62" rx="18" fill="#047857"/><rect x="64" y="720" width="760" height="22" fill="#047857"/><text x="92" y="721" class="group" style="fill:white">Timeline data</text><circle cx="94" cy="781" r="5" fill="#047857"/><text x="112" y="788" class="node">Dataset ← ModelDataset → TimelineModel</text><text x="112" y="815" class="small">Explicit source/record scopes govern shared data</text><circle cx="94" cy="858" r="5" fill="#047857"/><text x="112" y="865" class="node">DataSource + DatasetSource</text><text x="112" y="892" class="small">Stable sources, converters and field mappings</text><circle cx="94" cy="935" r="5" fill="#047857"/><text x="112" y="942" class="node">TimelineItem ← Session / Event</text><text x="112" y="969" class="small">start/end · data · render · parentSessionId links activities</text><circle cx="94" cy="1012" r="5" fill="#047857"/><text x="112" y="1019" class="node">Snapshot</text><text x="112" y="1046" class="small">JSON envelope: manifest · models · filters · records</text><rect x="936" y="680" width="760" height="400" rx="18" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="936" y="680" width="760" height="62" rx="18" fill="#b45309"/><rect x="936" y="720" width="760" height="22" fill="#b45309"/><text x="964" y="721" class="group" style="fill:white">Optional AI assistance</text><circle cx="966" cy="781" r="5" fill="#b45309"/><text x="984" y="788" class="node">AIProvider → AIModel</text><text x="984" y="815" class="small">Unified gateway; capability-based provider adapters</text><circle cx="966" cy="858" r="5" fill="#b45309"/><text x="984" y="865" class="node">TimelineModel → AIRequest</text><text x="984" y="892" class="small">Text or timeline image → validated candidate</text><circle cx="966" cy="935" r="5" fill="#b45309"/><text x="984" y="942" class="node">ImageAsset</text><text x="984" y="969" class="small">Scoped input with explicit provider sharing</text><circle cx="966" cy="1012" r="5" fill="#b45309"/><text x="984" y="1019" class="node">Admin reviews → accepts ModelVersion</text><text x="984" y="1046" class="small">Preview and diff before apply/save; AI stays optional</text><path d="M824 326 H925" class="edge"/><text x="880" y="277" text-anchor="middle" class="small">model</text><text x="880" y="299" text-anchor="middle" class="small">access</text><path d="M1316 550 V668" class="edge"/><text x="1335" y="605" class="small">admin assistance</text><path d="M936 485 H882 V615 H444 V668" class="edge"/><rect x="603" y="590" width="269" height="35" rx="6" fill="#f8fafc"/><text x="619" y="613" class="small">scoped dataset binding</text><path d="M1316 1080 V1122 H444 V1092" class="edge"/><rect x="685" y="1105" width="399" height="35" fill="#f8fafc"/><text x="704" y="1128" class="small">authorized data only when needed</text><rect x="64" y="1180" width="1632" height="98" rx="14" fill="#e2e8f0"/><text x="90" y="1219" class="note">Only admins use Model and YAML editors. Read/write users edit allowed records and filters; readers explore.</text><text x="90" y="1251" class="small">Cardinalities and permissions are proposed application rules. This overview simplifies links; the HBDS JSON is the full contract.</text></svg>
